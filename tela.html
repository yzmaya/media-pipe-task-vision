<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tela — pellizca tu entorno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --pearl:#EEEAF4; --pearl-dim:rgba(238,234,244,.62);
    --smoke:rgba(28,26,38,.52); --edge:rgba(238,234,244,.16);
    --lilac:#B9A7FF; --mint:#8FF0D4;
    font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--pearl);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1a1822;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{pointer-events:none}
  video{display:none}
  #intro{position:fixed;inset:0;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 40%, rgba(26,24,34,.35), rgba(26,24,34,.88));
    padding:24px;z-index:5;transition:opacity .5s ease}
  #intro.hide{opacity:0;pointer-events:none}
  .intro-box{max-width:30rem}
  .intro-box h1{font-weight:800;font-size:clamp(3.2rem,11vw,6.5rem);line-height:.9;letter-spacing:-.04em;margin:0 0 .35em;
    background:conic-gradient(from 200deg at 40% 60%, #fff, var(--lilac), var(--mint), #ffd7ef, #fff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .intro-box p{font-size:1.05rem;line-height:1.5;color:var(--pearl-dim);margin:0 0 1.6rem;max-width:26rem}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-weight:600;font-size:.98rem;border-radius:999px;padding:.8em 1.3em;cursor:pointer;
    border:1px solid var(--edge);background:transparent;color:var(--pearl)}
  button.primary{background:var(--pearl);color:#1a1822;border-color:var(--pearl)}
  button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
  #panel{position:fixed;left:max(14px, env(safe-area-inset-left));bottom:max(14px, env(safe-area-inset-bottom));
    z-index:4;width:min(290px, calc(100vw - 28px));background:var(--smoke);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--edge);border-radius:18px;padding:14px 16px;font-size:.88rem}
  #panel summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  #panel summary::-webkit-details-marker{display:none}
  #panel summary::after{content:"+";opacity:.6}
  #panel[open] summary::after{content:"–"}
  .ctl{margin-top:12px}
  .ctl label{display:flex;justify-content:space-between;color:var(--pearl-dim);margin-bottom:4px}
  input[type=range]{width:100%;accent-color:var(--lilac)}
  .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .btns button{padding:.5em .9em;font-size:.84rem}
  #back{position:fixed;top:max(14px, env(safe-area-inset-top));left:max(14px, env(safe-area-inset-left));z-index:6;
    color:var(--pearl);text-decoration:none;font-weight:600;font-size:.88rem;padding:.45em 1em;border-radius:999px;
    background:var(--smoke);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--edge)}
  #back:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
  #status{position:fixed;top:max(14px, env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:4;background:var(--smoke);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--edge);border-radius:999px;padding:.45em 1em;font-size:.85rem;color:var(--pearl-dim);
    white-space:nowrap;transition:opacity .4s}
  #status:empty{opacity:0}
  @media (prefers-reduced-motion: reduce){#intro{transition:none}}
</style>
</head>
<body>
<a id="back" href="index.html">Menú</a>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<video id="cam" playsinline muted></video>

<div id="intro">
  <div class="intro-box">
    <h1>Tela</h1>
    <p>Hay una lámina transparente entre tú y la cámara. Junta pulgar e índice para agarrarla, jálala y suéltala para verla regresar.</p>
    <div class="row">
      <button class="primary" id="btnCam">Activar cámara</button>
      <button id="btnMouse">Probar con el mouse</button>
    </div>
  </div>
</div>

<details id="panel">
  <summary>Ajustes de la tela</summary>
  <div class="ctl"><label for="stretch">Estirado <span id="vStretch"></span></label><input id="stretch" type="range" min="0" max="1.6" step="0.01" value="0.9"></div>
  <div class="ctl"><label for="wrinkle">Arrugas <span id="vWrinkle"></span></label><input id="wrinkle" type="range" min="0" max="2" step="0.01" value="1"></div>
  <div class="ctl"><label for="refr">Refracción <span id="vRefr"></span></label><input id="refr" type="range" min="0" max="2.5" step="0.05" value="1"></div>
  <div class="ctl"><label for="bounce">Rebote al soltar <span id="vBounce"></span></label><input id="bounce" type="range" min="0" max="1" step="0.01" value="0.55"></div>
  <div class="ctl"><label for="chroma">Arcoíris <span id="vChroma"></span></label><input id="chroma" type="range" min="0" max="2" step="0.05" value="0.8"></div>
  <div class="btns">
    <button id="btnReset">Alisar tela</button>
    <button id="btnDots">Ocultar puntos</button>
  </div>
</details>
<div id="status"></div>

<script type="module">
/* ================= Parámetros ================= */
const P = { stretch:.9, wrinkle:1, refr:1, bounce:.55, chroma:.8 };
for (const key of Object.keys(P)){
  const el = document.getElementById(key), out = document.getElementById('v' + key[0].toUpperCase() + key.slice(1));
  const upd = () => { P[key] = parseFloat(el.value); out.textContent = P[key].toFixed(2); };
  el.addEventListener('input', upd); upd();
}
const statusEl = document.getElementById('status');
const setStatus = t => statusEl.textContent = t;

/* ================= WebGL2 ================= */
const glc = document.getElementById('gl'), hud = document.getElementById('hud'), hctx = hud.getContext('2d');
const gl = glc.getContext('webgl2', { antialias:false });
if (!gl) { setStatus('Tu navegador no soporta WebGL2. Prueba en Chrome o Edge.'); throw new Error('no webgl2'); }
let W=0, H=0, DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR);
  glc.width=hud.width=W; glc.height=hud.height=H; gl.viewport(0,0,W,H); }
addEventListener('resize', resize); resize();

const VS = `#version 300 es
in vec2 p; out vec2 vUv;
void main(){ vUv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uVid, uT;
uniform vec2 uS, uGrid;
uniform float uChroma, uRefr, uHasVid, uAspect;

vec4 T(vec2 p){ return texture(uT, (p*(uGrid-1.)+.5)/uGrid); }

vec3 pattern(vec2 uv){
  vec2 q = vec2(uv.x*uAspect, uv.y)*9.;
  float c = mod(floor(q.x)+floor(q.y), 2.);
  return mix(vec3(.93,.91,.96), vec3(.36,.33,.48), c) * (.88 + .12*sin(uv.y*40.));
}
vec3 src(vec2 uv){
  if (uHasVid < .5) return pattern(uv);
  vec2 vu = .5 + (uv-.5)*uS; vu.x = 1.-vu.x;
  return texture(uVid, clamp(vu, .001, .999)).rgb;
}
void main(){
  vec2 uv = vUv;

  // 1) Estiramiento en el plano: mapeo inverso (lo que está bajo tus dedos te sigue)
  vec2 p = uv;
  for (int i=0;i<4;i++) p = uv - T(p).xy;

  // 2) Relieve de la lámina -> normales
  vec2 e = 1./(uGrid-1.);
  float hC = T(uv).z;
  float hL = T(uv-vec2(e.x,0.)).z, hR = T(uv+vec2(e.x,0.)).z;
  float hU = T(uv-vec2(0.,e.y)).z, hD = T(uv+vec2(0.,e.y)).z;
  vec2 g = vec2((hR-hL)/(2.*e.x*uAspect), (hD-hU)/(2.*e.y));
  float curv = (hL+hR+hU+hD-4.*hC)/(e.y*e.y);
  vec3 n = normalize(vec3(-g, 1.));

  // 3) Refracción con dispersión (cada color se dobla distinto)
  vec2 off = n.xy * uRefr * .055;
  off.x /= uAspect;
  float dsp = uChroma * .22;
  vec3 col = vec3(src(p + off*(1.-dsp)).r, src(p + off).g, src(p + off*(1.+dsp)).b);

  // 4) Película delgada: iridiscencia sólo donde la lámina se inclina
  float graze = clamp((1.-n.z)*4., 0., 1.);
  vec3 film = .5 + .5*cos(6.2831*(hC*38. + vec3(0.,.33,.67)));
  col = mix(col, col*.8 + film*.35, graze*.4*uChroma);

  // 5) Brillo especular y sombra suave en los valles de los pliegues
  vec3 L = normalize(vec3(-.45,-.55,.7));
  vec3 Hh = normalize(L + vec3(0.,0.,1.));
  col += pow(max(dot(n,Hh),0.), 90.) * .85;
  col += pow(1.-n.z, 2.) * .18;
  col *= 1. + clamp(curv*.0009, -.22, .06);

  o = vec4(col, 1.);
}`;

function sh(t, s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);
const U = n => gl.getUniformLocation(prog,n);
const u = { vid:U('uVid'), T:U('uT'), S:U('uS'), grid:U('uGrid'), chroma:U('uChroma'), refr:U('uRefr'), hasVid:U('uHasVid'), aspect:U('uAspect') };

function mkTex(unit){ const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
  for (const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,v);
  return t; }

/* ================= Lámina: membrana fija al marco ================= */
const GX=128, GY=72, N=GX*GY;
const rest=new Float32Array(N*2), off=new Float32Array(N*2), vel=new Float32Array(N*2);
const h=new Float32Array(N), hv=new Float32Array(N);
const texData=new Float32Array(N*4);
for (let j=0;j<GY;j++) for (let i=0;i<GX;i++){ const k=j*GX+i; rest[2*k]=i/(GX-1); rest[2*k+1]=j/(GY-1); }

const vidTex = mkTex(0);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([40,38,50,255]));
const sheetTex = mkTex(1);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,GX,GY,0,gl.RGBA,gl.FLOAT,texData);
gl.uniform1i(u.vid,0); gl.uniform1i(u.T,1); gl.uniform2f(u.grid,GX,GY);

/* Agarres */
const grabs = new Map();
function startGrab(id, p){
  const asp=W/H;
  const g = { anchor:{...p}, cur:{...p}, t0:performance.now(), seed:Math.random()*6.283,
    r:new Float32Array(N), phi:new Float32Array(N), w:new Float32Array(N), wc:new Float32Array(N),
    base:new Float32Array(off), rel:new Float32Array(N*2),
    Tx:new Float32Array(N), Ty:new Float32Array(N), Th:new Float32Array(N), ch:new Float32Array(N) };
  for (let k=0;k<N;k++){
    const x=rest[2*k]+off[2*k], y=rest[2*k+1]+off[2*k+1];
    const qx=(x-p.x)*asp, qy=y-p.y, r=Math.hypot(qx,qy);
    g.r[k]=r; g.phi[k]=Math.atan2(qy,qx);
    g.w[k]=Math.exp(-(r*r)/(0.07*0.07));      // parche que sostienen los dedos
    g.wc[k]=Math.exp(-(r*r)/(0.035*0.035));   // centro que se junta
    g.rel[2*k]=p.x-x; g.rel[2*k+1]=p.y-y;
  }
  grabs.set(id, g);
}
function moveGrab(id,p){ const g=grabs.get(id); if(g){ g.cur.x=p.x; g.cur.y=p.y; } }
function endGrab(id){ grabs.delete(id); }

function computeTargets(g, now){
  const asp=W/H;
  const ramp=Math.min(1,(now-g.t0)/220), e=ramp*ramp*(3-2*ramp);
  const mx0=g.cur.x-g.anchor.x, my0=g.cur.y-g.anchor.y;
  const mag=Math.hypot(mx0*asp,my0);
  const sat=P.stretch*0.4/(0.4+mag);                    // la tela resiste cada vez más
  const mx=mx0*sat, my=my0*sat, magE=mag*sat;
  const ux=mag>1e-4?(mx0*asp)/mag:0, uy=mag>1e-4?my0/mag:0;
  const R=0.09+0.75*magE;                               // más jalas, más lejos llegan las arrugas
  const gather=0.3*P.wrinkle*e;
  for (let k=0;k<N;k++){
    const r=g.r[k], w=g.w[k];
    g.Tx[k]=g.base[2*k]+mx*w+g.rel[2*k]*gather*g.wc[k];
    g.Ty[k]=g.base[2*k+1]+my*w+g.rel[2*k+1]*gather*g.wc[k];
    if (r>1.3){ g.ch[k]=0; continue; }
    const phi=g.phi[k];
    const c = r>1e-5 ? (Math.cos(phi)*ux+Math.sin(phi)*uy) : 0;
    const align = mag>1e-4 ? 0.3+0.7*c*c : 1;          // pliegues más marcados en la dirección del jalón
    const A = P.wrinkle*(0.006*e + 0.06*magE*align);
    const env = (1-Math.exp(-(r*r)/(0.03*0.03)))*Math.exp(-r/R);
    const phase = phi*10 + 1.4*Math.sin(phi*3+g.seed) + 0.8*Math.sin(phi*5-g.seed*2);
    const dome = 0.012*P.wrinkle*e*Math.exp(-(r*r)/(0.07*0.07));   // la lámina se levanta donde la pellizcas
    g.Th[k]=A*env*Math.sin(phase)+dome;
    g.ch[k]=0.22*Math.exp(-r/(R*0.8));
  }
}

function step(now){
  for (const g of grabs.values()) computeTargets(g, now);
  const SUB=4, dt=1/240;
  const kN=3000, kR=6, dmp=0.965+0.03*P.bounce;
  const c2=2500, kh=16, dh=0.968+0.028*P.bounce;
  const G2=2*GX;
  for (let s=0;s<SUB;s++){
    for (let j=1;j<GY-1;j++) for (let i=1;i<GX-1;i++){
      const k=j*GX+i, a=2*k;
      const lx=off[a-2]+off[a+2]+off[a-G2]+off[a+G2]-4*off[a];
      const ly=off[a-1]+off[a+3]+off[a-G2+1]+off[a+G2+1]-4*off[a+1];
      vel[a]=(vel[a]+(kN*lx-kR*off[a])*dt)*dmp;
      vel[a+1]=(vel[a+1]+(kN*ly-kR*off[a+1])*dt)*dmp;
      const lh=h[k-1]+h[k+1]+h[k-GX]+h[k+GX]-4*h[k];
      hv[k]=(hv[k]+(c2*lh-kh*h[k])*dt)*dh;
    }
    for (let j=1;j<GY-1;j++) for (let i=1;i<GX-1;i++){
      const k=j*GX+i, a=2*k;
      off[a]+=vel[a]*dt; off[a+1]+=vel[a+1]*dt; h[k]+=hv[k]*dt;
    }
    for (const g of grabs.values()){
      for (let j=1;j<GY-1;j++) for (let i=1;i<GX-1;i++){
        const k=j*GX+i, a=2*k;
        const c=0.85*g.w[k];
        if (c>0.002){ off[a]+=(g.Tx[k]-off[a])*c; off[a+1]+=(g.Ty[k]-off[a+1])*c; vel[a]*=1-c; vel[a+1]*=1-c; }
        const ch=g.ch[k];
        if (ch>0.002){ h[k]+=(g.Th[k]-h[k])*ch; hv[k]*=1-ch; }
      }
    }
  }
  for (let k=0;k<N;k++){ texData[4*k]=off[2*k]; texData[4*k+1]=off[2*k+1]; texData[4*k+2]=h[k]; }
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sheetTex);
  gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,GX,GY,gl.RGBA,gl.FLOAT,texData);
}

/* ================= Filtro One Euro (quita el temblor de la mano) ================= */
class OneEuro{
  constructor(minCut=1.4, beta=3, dCut=1){ Object.assign(this,{minCut,beta,dCut}); this.x=null; this.dx=0; this.t=0; }
  a(cut,dt){ const r=2*Math.PI*cut*dt; return r/(r+1); }
  f(x,t){
    if (this.x===null){ this.x=x; this.t=t; return x; }
    const dt=Math.max(1e-3,(t-this.t)/1000); this.t=t;
    const dx=(x-this.x)/dt; this.dx+=this.a(this.dCut,dt)*(dx-this.dx);
    const cut=this.minCut+this.beta*Math.abs(this.dx);
    this.x+=this.a(cut,dt)*(x-this.x); return this.x;
  }
  reset(){ this.x=null; this.dx=0; }
}

/* ================= Cámara + MediaPipe ================= */
const video=document.getElementById('cam');
let hasVid=false, landmarker=null, lastVT=-1, S=[1,1], showDots=true;
const mkHand=()=>({pinch:false,p:null,lm:null,fx:new OneEuro(),fy:new OneEuro()});
const hands={ Left:mkHand(), Right:mkHand() };

function coverScale(){
  if(!hasVid||!video.videoWidth) return [1,1];
  const va=video.videoWidth/video.videoHeight, ca=W/H;
  return ca>va ? [1,va/ca] : [ca/va,1];
}
const toDisplay = lm => ({ x:.5+((1-lm.x)-.5)/S[0], y:.5+(lm.y-.5)/S[1] });

async function startCamera(){
  setStatus('Pidiendo permiso de cámara…');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream; await video.play(); hasVid=true;
  }catch{ setStatus('No se pudo abrir la cámara. Revisa el permiso del navegador; mientras, usa el mouse.'); return; }
  setStatus('Cargando el detector de manos…');
  try{
    const { FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d },
      runningMode:'VIDEO', numHands:2, minHandDetectionConfidence:.5, minHandPresenceConfidence:.5, minTrackingConfidence:.5 });
    try{ landmarker=await HandLandmarker.createFromOptions(files,opts('GPU')); }
    catch{ landmarker=await HandLandmarker.createFromOptions(files,opts('CPU')); }
    setStatus('Listo: junta pulgar e índice para agarrar la tela'); setTimeout(()=>setStatus(''),4000);
  }catch(err){ console.error(err); setStatus('No cargó el detector de manos (se necesita internet). El mouse sigue funcionando.'); }
}

function detect(now){
  if(!landmarker||video.readyState<2||video.currentTime===lastVT) return;
  lastVT=video.currentTime;
  const res=landmarker.detectForVideo(video,now), seen=new Set();
  (res.landmarks||[]).forEach((lm,i)=>{
    const side=res.handednesses?.[i]?.[0]?.categoryName||(i?'Right':'Left');
    const hd=hands[side]; if(!hd) return; seen.add(side); hd.lm=lm;
    const t=lm[4], ix=lm[8], size=Math.hypot(lm[0].x-lm[5].x, lm[0].y-lm[5].y)||1e-3;
    const ratio=Math.hypot(t.x-ix.x,t.y-ix.y,(t.z-ix.z)*.5)/size;
    const raw=toDisplay({x:(t.x+ix.x)/2,y:(t.y+ix.y)/2});
    const p={ x:hd.fx.f(raw.x,now), y:hd.fy.f(raw.y,now) };
    hd.p=p;
    if(!hd.pinch && ratio<.28){ hd.pinch=true; startGrab(side,p); }
    else if(hd.pinch && ratio>.45){ hd.pinch=false; endGrab(side); }
    else if(hd.pinch) moveGrab(side,p);
  });
  for(const side of ['Left','Right']) if(!seen.has(side)){
    const hd=hands[side]; if(hd.pinch) endGrab(side);
    hd.pinch=false; hd.lm=null; hd.p=null; hd.fx.reset(); hd.fy.reset();
  }
}

/* ================= Mouse / touch ================= */
const evUV=e=>({x:e.clientX/innerWidth,y:e.clientY/innerHeight});
glc.addEventListener('pointerdown',e=>{ glc.setPointerCapture(e.pointerId); startGrab('ptr'+e.pointerId,evUV(e)); });
glc.addEventListener('pointermove',e=>moveGrab('ptr'+e.pointerId,evUV(e)));
const up=e=>endGrab('ptr'+e.pointerId);
glc.addEventListener('pointerup',up); glc.addEventListener('pointercancel',up);

/* ================= HUD ================= */
function drawHud(t){
  hctx.clearRect(0,0,W,H); if(!showDots) return;
  for(const side of ['Left','Right']){
    const hd=hands[side]; if(!hd.lm) continue;
    const a=toDisplay(hd.lm[4]), b=toDisplay(hd.lm[8]);
    hctx.lineWidth=1.5*DPR;
    hctx.strokeStyle=hd.pinch?'rgba(143,240,212,.85)':'rgba(238,234,244,.4)';
    hctx.beginPath(); hctx.moveTo(a.x*W,a.y*H); hctx.lineTo(b.x*W,b.y*H); hctx.stroke();
    hctx.fillStyle='rgba(238,234,244,.85)';
    for(const q of [a,b]){ hctx.beginPath(); hctx.arc(q.x*W,q.y*H,3.5*DPR,0,7); hctx.fill(); }
  }
}

/* ================= Loop ================= */
function frame(t){
  S=coverScale(); detect(t); step(t);
  if(hasVid&&video.readyState>=2){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,vidTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video); }
  gl.uniform2f(u.S,S[0],S[1]); gl.uniform1f(u.chroma,P.chroma); gl.uniform1f(u.refr,P.refr);
  gl.uniform1f(u.hasVid,hasVid?1:0); gl.uniform1f(u.aspect,W/H);
  gl.drawArrays(gl.TRIANGLES,0,3);
  drawHud(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= UI ================= */
const intro=document.getElementById('intro');
document.getElementById('btnCam').onclick=()=>{ intro.classList.add('hide'); startCamera(); };
document.getElementById('btnMouse').onclick=()=>{ intro.classList.add('hide'); setStatus('Haz clic y arrastra sobre la imagen'); setTimeout(()=>setStatus(''),3500); };
document.getElementById('btnReset').onclick=()=>{ off.fill(0); vel.fill(0); h.fill(0); hv.fill(0); grabs.clear(); };
const bd=document.getElementById('btnDots');
bd.onclick=()=>{ showDots=!showDots; bd.textContent=showDots?'Ocultar puntos':'Mostrar puntos'; };
if(innerWidth>700) document.getElementById('panel').open=true;
</script>
