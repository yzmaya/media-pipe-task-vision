<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hombre de arena — tu cuerpo se desmorona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --pearl:#F4EDE2; --pearl-dim:rgba(244,237,226,.66);
    --smoke:rgba(34,24,16,.55); --edge:rgba(240,210,160,.2);
    --sand:#E2BF86; --dune:#B8854F;
    font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--pearl);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1c140d;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  video{display:none}
  .chip{background:var(--smoke);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--edge);border-radius:999px}
  #back{position:fixed;top:max(14px, env(safe-area-inset-top));left:max(14px, env(safe-area-inset-left));z-index:6;
    color:var(--pearl);text-decoration:none;font-weight:600;font-size:.88rem;padding:.45em 1em}
  #back:focus-visible,button:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
  #intro{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:5;
    background:radial-gradient(120% 90% at 50% 40%, rgba(28,20,13,.3), rgba(28,20,13,.92));transition:opacity .5s}
  #intro.hide{opacity:0;pointer-events:none}
  .intro-box{max-width:32rem}
  .intro-box h1{font-weight:800;font-size:clamp(2.8rem,10vw,5.8rem);line-height:.92;letter-spacing:-.04em;margin:0 0 .35em;
    background:linear-gradient(170deg,#fff3dc 10%,var(--sand) 45%,var(--dune) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .intro-box p{font-size:1.05rem;line-height:1.5;color:var(--pearl-dim);margin:0 0 1.6rem;max-width:28rem}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-weight:600;font-size:.98rem;border-radius:999px;padding:.8em 1.3em;cursor:pointer;
    border:1px solid var(--edge);background:transparent;color:var(--pearl)}
  button.primary{background:var(--pearl);color:#1c140d;border-color:var(--pearl)}
  #panel{position:fixed;left:max(14px, env(safe-area-inset-left));bottom:max(14px, env(safe-area-inset-bottom));z-index:4;
    width:min(290px, calc(100vw - 28px));background:var(--smoke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--edge);border-radius:18px;padding:14px 16px;font-size:.88rem}
  #panel summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  #panel summary::-webkit-details-marker{display:none}
  #panel summary::after{content:"+";opacity:.6}
  #panel[open] summary::after{content:"–"}
  .ctl{margin-top:12px}
  .ctl label{display:flex;justify-content:space-between;color:var(--pearl-dim);margin-bottom:4px}
  input[type=range]{width:100%;accent-color:var(--sand)}
  .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .btns button{padding:.5em .9em;font-size:.84rem}
  #status{position:fixed;top:max(14px, env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;
    padding:.45em 1em;font-size:.85rem;color:var(--pearl-dim);white-space:nowrap;transition:opacity .4s}
  #status:empty{opacity:0}
  @media (max-width:700px){ #status{top:calc(max(14px, env(safe-area-inset-top)) + 44px)} }
  @media (prefers-reduced-motion: reduce){#intro{transition:none}}
</style>
</head>
<body>
<a id="back" class="chip" href="index.html">Menú</a>
<canvas id="gl"></canvas>
<video id="cam" playsinline muted></video>

<div id="intro">
  <div class="intro-box">
    <h1>Hombre de arena</h1>
    <p>Tu cuerpo se cubre de arena tornasol. Cada movimiento lo desmorona un poco: los granos se desprenden de tu contorno y caen al suelo.</p>
    <div class="row">
      <button class="primary" id="btnCam">Activar cámara</button>
      <button id="btnMouse">Probar con el mouse</button>
    </div>
  </div>
</div>

<details id="panel">
  <summary>Ajustes de la arena</summary>
  <div class="ctl"><label for="rate">Arena que se desprende <span id="vRate"></span></label><input id="rate" type="range" min="0.05" max="1" step="0.01" value="0.4"></div>
  <div class="ctl"><label for="idle">Desgaste estando quieto <span id="vIdle"></span></label><input id="idle" type="range" min="0" max="0.2" step="0.005" value="0.03"></div>
  <div class="ctl"><label for="grav">Gravedad <span id="vGrav"></span></label><input id="grav" type="range" min="0.2" max="2.5" step="0.05" value="1"></div>
  <div class="ctl"><label for="wind">Viento <span id="vWind"></span></label><input id="wind" type="range" min="0" max="1.5" step="0.05" value="0.35"></div>
  <div class="ctl"><label for="iri">Tornasol <span id="vIri"></span></label><input id="iri" type="range" min="0" max="1" step="0.01" value="1"></div>
  <div class="ctl"><label for="bg">Oscurecer fondo <span id="vBg"></span></label><input id="bg" type="range" min="0" max="1" step="0.01" value="0.55"></div>
  <div class="btns"><button id="btnReset">Barrer la arena</button></div>
</details>
<div id="status" class="chip"></div>

<script type="module">
/* ================= Parámetros ================= */
const P={ rate:.4, idle:.03, grav:1, wind:.35, bg:.55, iri:1 };
for(const key of Object.keys(P)){
  const el=document.getElementById(key), out=document.getElementById('v'+key[0].toUpperCase()+key.slice(1));
  const upd=()=>{ P[key]=parseFloat(el.value); out.textContent=P[key].toFixed(2); };
  el.addEventListener('input',upd); upd();
}
const statusEl=document.getElementById('status');
const setStatus=t=>statusEl.textContent=t;

/* ================= WebGL2 ================= */
const glc=document.getElementById('gl');
const gl=glc.getContext('webgl2',{antialias:false,premultipliedAlpha:false});
if(!gl){ setStatus('Tu navegador no soporta WebGL2. Prueba en Chrome o Edge.'); throw new Error('no webgl2'); }
if(!gl.getExtension('EXT_color_buffer_float')){ setStatus('Tu tarjeta de video no soporta este efecto.'); throw new Error('no float fb'); }
gl.getExtension('OES_texture_float_linear');

const COMMON=`
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float h3(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
uniform vec2 uS;
vec2 toVid(vec2 uv){ vec2 vu=.5+(uv-.5)*uS; vu.x=1.-vu.x; return vu; }`;

const VS_FULL=`#version 300 es
in vec2 p; out vec2 vUv;
void main(){ vUv=vec2(p.x*.5+.5,.5-p.y*.5); gl_Position=vec4(p,0.,1.); }`;

/* Partículas: tex0 = (x, y, vx, vy)  tex1 = (vida, tamaño, tono, viva) */
const UPDATE=`#version 300 es
precision highp float;
in vec2 vUv;
layout(location=0) out vec4 o0;
layout(location=1) out vec4 o1;
uniform sampler2D uP0, uP1, uCur, uPrev;
uniform float uAspect, uDt, uTime, uRate, uIdle, uGrav, uWind, uHasMask;
uniform vec4 uPtr;
${COMMON}
float maskAt(sampler2D m, vec2 uv){
  vec2 vu=toVid(uv);
  if(vu.x<0.||vu.y<0.||vu.x>1.||vu.y>1.) return 0.;
  return texture(m,vu).r;
}
void main(){
  ivec2 c=ivec2(gl_FragCoord.xy);
  vec4 a=texelFetch(uP0,c,0), b=texelFetch(uP1,c,0);
  vec2 id=gl_FragCoord.xy;
  float t=mod(uTime,97.);

  if(b.w>.5){                                   // grano vivo: cae
    vec2 pos=a.xy, vel=a.zw;
    bool settled=pos.y>=.993;
    if(!settled){
      float w=(noise(vec2(pos.y*5.+uTime*.35,pos.x*3.+b.z*4.))-.45)*uWind;
      vel+=vec2(w*1.6, uGrav*1.1)*uDt;
      vel*=.988;
      pos+=vec2(vel.x/uAspect, vel.y)*uDt;
      if(pos.y>=.993){ pos.y=.993; vel=vec2(0.); }
    }
    float life=b.x-uDt*(settled?.9:.22);
    if(life<=0.||pos.x<-.05||pos.x>1.05){ o0=vec4(0.); o1=vec4(0.,b.y,b.z,0.); return; }
    o0=vec4(pos,vel); o1=vec4(life,b.y,b.z,1.); return;
  }

  // grano libre: intenta desprenderse de un punto al azar del cuerpo
  vec2 cand=vec2(h3(vec3(id,t)), h3(vec3(id,t+17.3)));
  float e=0.;
  if(uHasMask>.5){
    float cur=maskAt(uCur,cand), prev=maskAt(uPrev,cand);
    float r=.012;
    float mn=min(min(maskAt(uCur,cand+vec2(r/uAspect,0.)),maskAt(uCur,cand-vec2(r/uAspect,0.))),
                 min(maskAt(uCur,cand+vec2(0.,r)),maskAt(uCur,cand-vec2(0.,r))));
    float rim=smoothstep(.45,.8,cur)*smoothstep(.45,.15,mn);   // pegado al contorno, por dentro
    float moved=smoothstep(.3,.65,prev-cur);                   // donde tu cuerpo estaba y ya no
    e=moved*1.5 + uIdle*rim*2.;
  }
  if(uPtr.w>.5){ vec2 d=(cand-uPtr.xy)*vec2(uAspect,1.); e+=exp(-dot(d,d)/.0015)*clamp(uPtr.z,0.,2.); }

  if(h3(vec3(id,t+41.7))<e*uRate){
    float dx=.012;
    vec2 g=vec2(maskAt(uCur,cand+vec2(dx,0.))-maskAt(uCur,cand-vec2(dx,0.)),
                maskAt(uCur,cand+vec2(0.,dx))-maskAt(uCur,cand-vec2(0.,dx)));
    float r1=h3(vec3(id,t+5.1)), r2=h3(vec3(id,t+9.7));
    float glen=length(g);
    vec2 outw=glen>.001 ? -g/glen*.025 : vec2(0.);
    vec2 vel=outw + vec2((r1-.5)*.03, .02+.03*r2);   // se desliza del borde y cae, sin brincar
    o0=vec4(cand,vel);
    o1=vec4(.7+.3*r2, r1, h3(vec3(id,t+2.2)), 1.);
    return;
  }
  o0=vec4(0.); o1=vec4(0.,b.y,b.z,0.);
}`;

const SCENE=`#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uVid, uCur;
uniform float uAspect, uHasVid, uHasMask, uBg, uTime, uIri;
uniform vec2 uRes;
${COMMON}
vec3 sandRamp(float L){
  vec3 d=vec3(.26,.16,.09), m=vec3(.72,.53,.32), l=vec3(.98,.89,.7);
  return L<.5 ? mix(d,m,L*2.) : mix(m,l,(L-.5)*2.);
}
vec3 dunes(vec2 uv){
  float x=uv.x*uAspect;
  vec3 sky=mix(vec3(.95,.72,.45), vec3(.45,.3,.35), 1.-uv.y*1.4);
  float d1=.62+.05*sin(x*2.3+1.)+.03*sin(x*5.1);
  float d2=.75+.04*sin(x*1.7+3.)+.02*sin(x*6.3);
  vec3 c=sky;
  if(uv.y>d1) c=mix(vec3(.78,.52,.3),vec3(.55,.34,.2),smoothstep(0.,.15,uv.y-d1));
  if(uv.y>d2) c=mix(vec3(.86,.62,.38),vec3(.62,.4,.24),smoothstep(0.,.2,uv.y-d2));
  return c;
}
void main(){
  vec2 uv=vUv, vu=clamp(toVid(uv),.001,.999);
  vec3 v=uHasVid>.5 ? texture(uVid,vu).rgb : dunes(uv);
  float gray=dot(v,vec3(.3,.59,.11));
  vec3 bg=mix(vec3(gray)*vec3(1.,.9,.78), v, .3)*(1.-uBg*.82);
  if(uHasVid<.5) bg=v*(1.-uBg*.5);

  float m=uHasMask>.5 ? texture(uCur,vu).r : 0.;
  vec2 px=uv*uRes;
  float grain=hash(floor(px/1.6));
  float edge=m+(noise(uv*vec2(uAspect,1.)*85.)-.5)*.34+(grain-.5)*.14;   // borde que se desmorona
  float a=smoothstep(.46,.6,edge);

  float L=pow(clamp(gray*1.3,0.,1.),.85);
  vec3 sand=sandRamp(L);

  // tornasol: el color cambia con el relieve (luz de la imagen), la posición y el tiempo
  vec2 e2=vec2(3./uRes.x,3./uRes.y);
  float lx=0., ly=0.;
  if(uHasVid>.5){
    vec3 w=vec3(.3,.59,.11);
    lx=dot(texture(uVid,clamp(toVid(uv+vec2(e2.x,0.)),.001,.999)).rgb,w)-dot(texture(uVid,clamp(toVid(uv-vec2(e2.x,0.)),.001,.999)).rgb,w);
    ly=dot(texture(uVid,clamp(toVid(uv+vec2(0.,e2.y)),.001,.999)).rgb,w)-dot(texture(uVid,clamp(toVid(uv-vec2(0.,e2.y)),.001,.999)).rgb,w);
  }
  float hue=L*1.15+uv.x*.35+uv.y*.25+(lx*.7+ly*.5)*6.+uTime*.035;
  vec3 iri=.5+.5*cos(6.2831*(hue+vec3(0.,.33,.67)));
  vec3 pearl=mix(vec3(.16,.14,.2),vec3(1.),L);
  vec3 tor=mix(pearl, pearl*(.35+iri*1.15), .75);
  float glint=step(.993,hash(floor(px/1.6)+floor(uTime*.7)*7.13))*.55;   // destellos lentos
  sand=mix(sand, tor+glint, uIri);
  sand*=.8+.4*grain;
  sand*=.9+.2*noise(uv*vec2(uAspect,1.)*240.);
  o=vec4(mix(bg,sand,a),1.);
}`;

const VS_PTS=`#version 300 es
uniform sampler2D uP0, uP1;
uniform int uW;
uniform float uPt;
out float vLife; out float vTone;
void main(){
  ivec2 c=ivec2(gl_VertexID % uW, gl_VertexID / uW);
  vec4 a=texelFetch(uP0,c,0), b=texelFetch(uP1,c,0);
  vLife=b.x; vTone=b.z;
  if(b.w<.5){ gl_Position=vec4(2.,2.,0.,1.); gl_PointSize=1.; return; }
  gl_Position=vec4(a.x*2.-1., 1.-a.y*2., 0., 1.);
  gl_PointSize=uPt*(.6+b.y*.9);
}`;
const FS_PTS=`#version 300 es
precision highp float;
in float vLife; in float vTone; out vec4 o;
uniform float uIri, uTime;
void main(){
  vec3 c=mix(vec3(.5,.36,.21), vec3(.95,.83,.62), vTone);
  vec3 iri=.55+.45*cos(6.2831*(vTone*1.3+uTime*.035+vec3(0.,.33,.67)));
  c=mix(c, iri*(.7+.3*vTone), uIri);
  o=vec4(c, clamp(vLife*2.5,0.,1.)*.95);
}`;

function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
function mkProg(vs,fs){ const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(pr,0,'p'); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  const U={}; const n=gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const nm=gl.getActiveUniform(pr,i).name.replace('[0]',''); U[nm]=gl.getUniformLocation(pr,nm); }
  return {pr,U}; }
const upd=mkProg(VS_FULL,UPDATE), scene=mkProg(VS_FULL,SCENE), pts=mkProg(VS_PTS,FS_PTS);

const vaoFull=gl.createVertexArray(); gl.bindVertexArray(vaoFull);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const vaoPts=gl.createVertexArray();
gl.bindVertexArray(null);

function tex(filter){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,filter],[gl.TEXTURE_MAG_FILTER,filter],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,v);
  return t; }

/* Estado de partículas (ping-pong con dos texturas cada uno) */
const PW=256, PH=256, NP=PW*PH;
function mkState(){
  const t0=tex(gl.NEAREST); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,PW,PH,0,gl.RGBA,gl.FLOAT,null);
  const t1=tex(gl.NEAREST); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,PW,PH,0,gl.RGBA,gl.FLOAT,null);
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t0,0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT1,gl.TEXTURE_2D,t1,0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1]);
  gl.clearBufferfv(gl.COLOR,0,[0,0,0,0]); gl.clearBufferfv(gl.COLOR,1,[0,0,0,0]);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {t0,t1,fb};
}
let SA=mkState(), SB=mkState();
function sweep(){ for(const s of [SA,SB]){ gl.bindFramebuffer(gl.FRAMEBUFFER,s.fb); gl.clearBufferfv(gl.COLOR,0,[0,0,0,0]); gl.clearBufferfv(gl.COLOR,1,[0,0,0,0]); } gl.bindFramebuffer(gl.FRAMEBUFFER,null); }

const vidTex=tex(gl.LINEAR); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
let curMask=tex(gl.LINEAR), prevMask=tex(gl.LINEAR);
for(const m of [curMask,prevMask]){ gl.bindTexture(gl.TEXTURE_2D,m); gl.texImage2D(gl.TEXTURE_2D,0,gl.R16F,1,1,0,gl.RED,gl.FLOAT,new Float32Array([0])); }
let hasMask=false;

let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR); glc.width=W; glc.height=H; }
addEventListener('resize',resize); resize();

/* ================= Cámara + segmentación ================= */
const video=document.getElementById('cam');
let hasVid=false, segmenter=null, lastVT=-1, S=[1,1];
function coverScale(){ if(!hasVid||!video.videoWidth) return [1,1];
  const va=video.videoWidth/video.videoHeight, ca=W/H; return ca>va?[1,va/ca]:[ca/va,1]; }

async function startCamera(){
  setStatus('Pidiendo permiso de cámara…');
  try{ const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=st; await video.play(); hasVid=true;
  }catch{ setStatus('No se pudo abrir la cámara. Revisa el permiso del navegador; mientras, usa el mouse.'); return; }
  setStatus('Cargando el detector de cuerpo…');
  try{
    const { FilesetResolver, ImageSegmenter } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite',delegate:d},
      runningMode:'VIDEO', outputConfidenceMasks:true, outputCategoryMask:false});
    try{ segmenter=await ImageSegmenter.createFromOptions(files,opts('GPU')); }
    catch{ segmenter=await ImageSegmenter.createFromOptions(files,opts('CPU')); }
    setStatus('Listo: aléjate un poco y muévete'); setTimeout(()=>setStatus(''),4000);
  }catch(e){ console.error(e); setStatus('No cargó el detector de cuerpo (se necesita internet). El mouse sigue funcionando.'); }
}

function segment(now){
  if(!segmenter||video.readyState<2||video.currentTime===lastVT) return;
  lastVT=video.currentTime;
  segmenter.segmentForVideo(video,now,res=>{
    const masks=res.confidenceMasks; if(!masks||!masks.length) return;
    const mk=masks[masks.length-1];
    const data=mk.getAsFloat32Array();
    if(masks.length>1) for(let i=0;i<data.length;i++) data[i]=1-masks[0].getAsFloat32Array()[i];
    [curMask,prevMask]=[prevMask,curMask];          // lo actual pasa a ser lo anterior
    gl.bindTexture(gl.TEXTURE_2D,curMask);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.R16F,mk.width,mk.height,0,gl.RED,gl.FLOAT,data);
    if(!hasMask){ gl.bindTexture(gl.TEXTURE_2D,prevMask); gl.texImage2D(gl.TEXTURE_2D,0,gl.R16F,mk.width,mk.height,0,gl.RED,gl.FLOAT,data); }
    hasMask=true;
  });
}

/* ================= Mouse / touch ================= */
const ptr={x:0,y:0,sp:0,on:false,t:0};
const evUV=e=>({x:e.clientX/innerWidth,y:e.clientY/innerHeight});
glc.addEventListener('pointerdown',e=>{ glc.setPointerCapture(e.pointerId); const p=evUV(e); Object.assign(ptr,{x:p.x,y:p.y,on:true,sp:.6,t:performance.now()}); });
glc.addEventListener('pointermove',e=>{ if(!ptr.on) return; const p=evUV(e), now=performance.now(), dt=Math.max(.008,(now-ptr.t)/1000);
  const s=Math.hypot((p.x-ptr.x)*W/H,p.y-ptr.y)/dt; ptr.sp=ptr.sp*.6+s*.4; Object.assign(ptr,{x:p.x,y:p.y,t:now}); });
const up=()=>{ ptr.on=false; };
glc.addEventListener('pointerup',up); glc.addEventListener('pointercancel',up);

/* ================= Loop ================= */
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  S=coverScale(); segment(t);
  ptr.sp*=.92;

  // 1) mover los granos
  gl.bindVertexArray(vaoFull);
  gl.disable(gl.BLEND);
  gl.useProgram(upd.pr); gl.bindFramebuffer(gl.FRAMEBUFFER,SB.fb); gl.viewport(0,0,PW,PH);
  const bindT=(unit,t,loc)=>{ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t); gl.uniform1i(loc,unit); };
  bindT(0,SA.t0,upd.U.uP0); bindT(1,SA.t1,upd.U.uP1); bindT(2,curMask,upd.U.uCur); bindT(3,prevMask,upd.U.uPrev);
  gl.uniform2f(upd.U.uS,S[0],S[1]); gl.uniform1f(upd.U.uAspect,W/H); gl.uniform1f(upd.U.uDt,dt);
  gl.uniform1f(upd.U.uTime,(t*.001)%1000); gl.uniform1f(upd.U.uRate,P.rate); gl.uniform1f(upd.U.uIdle,P.idle);
  gl.uniform1f(upd.U.uGrav,P.grav); gl.uniform1f(upd.U.uWind,P.wind); gl.uniform1f(upd.U.uHasMask,hasMask?1:0);
  gl.uniform4f(upd.U.uPtr,ptr.x,ptr.y,Math.min(ptr.sp,2),ptr.on?1:0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  [SA,SB]=[SB,SA];

  // 2) escena: fondo + cuerpo de arena
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.useProgram(scene.pr);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D,vidTex);
  if(hasVid&&video.readyState>=2) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  gl.uniform1i(scene.U.uVid,4); bindT(2,curMask,scene.U.uCur);
  gl.uniform2f(scene.U.uS,S[0],S[1]); gl.uniform1f(scene.U.uAspect,W/H);
  gl.uniform1f(scene.U.uHasVid,hasVid?1:0); gl.uniform1f(scene.U.uHasMask,hasMask?1:0);
  gl.uniform1f(scene.U.uBg,P.bg); gl.uniform1f(scene.U.uIri,P.iri); gl.uniform1f(scene.U.uTime,(t*.001)%1000); gl.uniform2f(scene.U.uRes,W,H);
  gl.drawArrays(gl.TRIANGLES,0,3);

  // 3) granos sueltos encima
  gl.bindVertexArray(vaoPts);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(pts.pr);
  bindT(0,SA.t0,pts.U.uP0); bindT(1,SA.t1,pts.U.uP1);
  gl.uniform1i(pts.U.uW,PW); gl.uniform1f(pts.U.uIri,P.iri); gl.uniform1f(pts.U.uTime,(t*.001)%1000); gl.uniform1f(pts.U.uPt,2*DPR);
  gl.drawArrays(gl.POINTS,0,NP);
  gl.disable(gl.BLEND);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= UI ================= */
const intro=document.getElementById('intro');
document.getElementById('btnCam').onclick=()=>{ intro.classList.add('hide'); startCamera(); };
document.getElementById('btnMouse').onclick=()=>{ intro.classList.add('hide'); setStatus('Haz clic y arrastra para soltar arena'); setTimeout(()=>setStatus(''),3500); };
document.getElementById('btnReset').onclick=sweep;
if(innerWidth>700) document.getElementById('panel').open=true;
</script>
</body>
