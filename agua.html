<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agua — toca la superficie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --pearl:#EEEAF4; --pearl-dim:rgba(238,234,244,.64);
    --smoke:rgba(16,30,40,.5); --edge:rgba(220,240,255,.18);
    --pool:#8CCBFF; --mint:#8FF0D4;
    font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--pearl);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0f2230;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{pointer-events:none}
  video{display:none}
  .chip{background:var(--smoke);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--edge);border-radius:999px}
  #back{position:fixed;top:max(14px, env(safe-area-inset-top));left:max(14px, env(safe-area-inset-left));z-index:6;
    color:var(--pearl);text-decoration:none;font-weight:600;font-size:.88rem;padding:.45em 1em}
  #back:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
  #intro{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:5;
    background:radial-gradient(120% 90% at 50% 40%, rgba(15,34,48,.3), rgba(15,34,48,.9));transition:opacity .5s}
  #intro.hide{opacity:0;pointer-events:none}
  .intro-box{max-width:30rem}
  .intro-box h1{font-weight:800;font-size:clamp(3.2rem,11vw,6.5rem);line-height:.9;letter-spacing:-.04em;margin:0 0 .35em;
    background:linear-gradient(175deg,#fff 20%,var(--pool) 60%,#3d86b8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .intro-box p{font-size:1.05rem;line-height:1.5;color:var(--pearl-dim);margin:0 0 1.6rem;max-width:26rem}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-weight:600;font-size:.98rem;border-radius:999px;padding:.8em 1.3em;cursor:pointer;
    border:1px solid var(--edge);background:transparent;color:var(--pearl)}
  button.primary{background:var(--pearl);color:#0f2230;border-color:var(--pearl)}
  #panel{position:fixed;left:max(14px, env(safe-area-inset-left));bottom:max(14px, env(safe-area-inset-bottom));z-index:4;
    width:min(290px, calc(100vw - 28px));background:var(--smoke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--edge);border-radius:18px;padding:14px 16px;font-size:.88rem}
  #panel summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  #panel summary::-webkit-details-marker{display:none}
  #panel summary::after{content:"+";opacity:.6}
  #panel[open] summary::after{content:"–"}
  .ctl{margin-top:12px}
  .ctl label{display:flex;justify-content:space-between;color:var(--pearl-dim);margin-bottom:4px}
  input[type=range]{width:100%;accent-color:var(--pool)}
  .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .btns button{padding:.5em .9em;font-size:.84rem}
  #meter{position:fixed;top:max(14px, env(safe-area-inset-top));right:max(14px, env(safe-area-inset-right));z-index:4;
    padding:.5em 1em;font-size:.85rem;display:flex;align-items:center;gap:.7em}
  #meter .bar{width:84px;height:5px;border-radius:5px;background:rgba(220,240,255,.18);overflow:hidden}
  #meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--pool),#fff);border-radius:5px}
  #status{position:fixed;bottom:max(14px, env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:4;
    padding:.45em 1em;font-size:.85rem;color:var(--pearl-dim);white-space:nowrap;transition:opacity .4s}
  #status:empty{opacity:0}
  @media (max-width:700px){ #status{bottom:auto;top:calc(max(14px, env(safe-area-inset-top)) + 44px)} }
  @media (prefers-reduced-motion: reduce){#intro{transition:none}}
</style>
</head>
<body>
<a id="back" class="chip" href="index.html">Menú</a>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<video id="cam" playsinline muted></video>

<div id="intro">
  <div class="intro-box">
    <h1>Agua</h1>
    <p>La pantalla es una superficie de agua y la yema de tu dedo índice la toca. Muévelo despacio para ondas suaves; rápido para agitarla.</p>
    <div class="row">
      <button class="primary" id="btnCam">Activar cámara</button>
      <button id="btnMouse">Probar con el mouse</button>
    </div>
  </div>
</div>

<div id="meter" class="chip" aria-live="polite"><span id="meterLabel">Calma</span><span class="bar"><span class="fill" id="meterFill"></span></span></div>

<details id="panel">
  <summary>Ajustes del agua</summary>
  <div class="ctl"><label for="sens">Sensibilidad a la velocidad <span id="vSens"></span></label><input id="sens" type="range" min="0.2" max="2.5" step="0.05" value="1"></div>
  <div class="ctl"><label for="visc">Viscosidad <span id="vVisc"></span></label><input id="visc" type="range" min="0" max="1" step="0.01" value="0.35"></div>
  <div class="ctl"><label for="refr">Refracción <span id="vRefr"></span></label><input id="refr" type="range" min="0" max="2.5" step="0.05" value="1"></div>
  <div class="ctl"><label for="foam">Espuma <span id="vFoam"></span></label><input id="foam" type="range" min="0" max="1" step="0.01" value="0.6"></div>
  <div class="ctl"><label for="chroma">Arcoíris <span id="vChroma"></span></label><input id="chroma" type="range" min="0" max="2" step="0.05" value="0.6"></div>
  <div class="btns">
    <button id="btnReset">Calmar el agua</button>
    <button id="btnDots">Ocultar yema</button>
  </div>
</details>
<div id="status" class="chip"></div>

<script type="module">
/* ================= Parámetros ================= */
const P = { sens:1, visc:.35, refr:1, foam:.6, chroma:.6 };
for (const key of Object.keys(P)){
  const el=document.getElementById(key), out=document.getElementById('v'+key[0].toUpperCase()+key.slice(1));
  const upd=()=>{ P[key]=parseFloat(el.value); out.textContent=P[key].toFixed(2); };
  el.addEventListener('input',upd); upd();
}
const statusEl=document.getElementById('status');
const setStatus=t=>statusEl.textContent=t;

/* ================= WebGL2 ================= */
const glc=document.getElementById('gl'), hud=document.getElementById('hud'), hctx=hud.getContext('2d');
const gl=glc.getContext('webgl2',{antialias:false});
if(!gl){ setStatus('Tu navegador no soporta WebGL2. Prueba en Chrome o Edge.'); throw new Error('no webgl2'); }
if(!gl.getExtension('EXT_color_buffer_float')){ setStatus('Tu tarjeta de video no soporta la simulación de agua.'); throw new Error('no float fb'); }
gl.getExtension('OES_texture_float_linear');

const VS=`#version 300 es
in vec2 p; out vec2 vUv;
void main(){ vUv=vec2(p.x*.5+.5,.5-p.y*.5); gl_Position=vec4(p,0.,1.); }`;

/* Simulación: R = altura actual, G = altura anterior, B = espuma */
const SIM=`#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uState;
uniform vec2 uPx;
uniform float uDamp, uAspect, uTime, uChop, uFoamGain;
uniform vec4 uA[12];   // xy = posición anterior, zw = posición actual
uniform vec4 uB[12];   // x = fuerza, y = radio
uniform int uCount;
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-9),0.,1.); return length(pa-ba*h); }
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
void main(){
  // tc = coordenadas de textura (y hacia arriba); los dedos llegan en pantalla (y hacia abajo)
  vec2 tc=gl_FragCoord.xy*uPx, uv=tc;
  vec4 s=texture(uState,tc);
  float l=texture(uState,tc-vec2(uPx.x,0.)).r, r=texture(uState,tc+vec2(uPx.x,0.)).r;
  float u=texture(uState,tc-vec2(0.,uPx.y)).r, d=texture(uState,tc+vec2(0.,uPx.y)).r;
  float nh=((l+r+u+d)*.5 - s.g)*uDamp;

  vec2 pp=vec2(tc.x*uAspect,1.-tc.y);
  for(int i=0;i<12;i++){
    if(i>=uCount) break;
    vec2 a=vec2(uA[i].x*uAspect,uA[i].y), b=vec2(uA[i].z*uAspect,uA[i].w);
    float dd=seg(pp,a,b), rad=uB[i].y;
    nh -= uB[i].x*exp(-dd*dd/(rad*rad));
  }
  // oleaje fino cuando el agua está agitada
  nh += uChop*(hash(uv*977.+uTime)-.5)*.012;

  float grad=length(vec2(r-l,d-u));
  float foam=s.b*.972 + smoothstep(.05,.22,grad)*uFoamGain;
  o=vec4(nh, s.r, clamp(foam,0.,1.), 1.);
}`;

const RENDER=`#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uState, uVid;
uniform vec2 uPx, uS;
uniform float uAspect, uHasVid, uRefr, uChroma, uE, uFoamVis;
vec3 pattern(vec2 uv){
  vec2 q=vec2(uv.x*uAspect,uv.y)*11.;
  vec2 f=abs(fract(q)-.5);
  float line=smoothstep(.46,.49,max(f.x,f.y));
  vec3 tile=mix(vec3(.55,.8,.9), vec3(.42,.7,.84), step(.5,fract((floor(q.x)+floor(q.y))*.5)));
  return mix(tile, vec3(.93,.97,1.), line*.8);
}
vec3 src(vec2 uv){
  if(uHasVid<.5) return pattern(uv);
  vec2 vu=.5+(uv-.5)*uS; vu.x=1.-vu.x;
  return texture(uVid,clamp(vu,.001,.999)).rgb;
}
void main(){
  vec2 uv=vUv;                       // pantalla, y hacia abajo
  vec2 tc=vec2(uv.x,1.-uv.y);        // textura de la simulación, y hacia arriba
  vec4 s=texture(uState,tc);
  float l=texture(uState,tc-vec2(uPx.x,0.)).r, r=texture(uState,tc+vec2(uPx.x,0.)).r;
  float u=texture(uState,tc+vec2(0.,uPx.y)).r, d=texture(uState,tc-vec2(0.,uPx.y)).r;
  vec2 g=vec2(r-l,d-u);
  vec3 n=normalize(vec3(-g*7.,1.));

  vec2 off=n.xy*uRefr*.045; off.x/=uAspect;
  float dsp=uChroma*(.1+.3*uE);
  vec3 col=vec3(src(uv+off*(1.-dsp)).r, src(uv+off).g, src(uv+off*(1.+dsp)).b);

  // cáusticas: las crestas concentran luz, los valles la dispersan
  float lap=l+r+u+d-4.*s.r;
  col*=1.+clamp(-lap*5.,-.16,.38);

  // reflejo del cielo/luz en la superficie
  vec3 L=normalize(vec3(-.4,-.6,.7)), Hh=normalize(L+vec3(0.,0.,1.));
  col+=pow(max(dot(n,Hh),0.),160.)*(.6+.9*uE);
  col+=pow(1.-n.z,2.)*vec3(.7,.85,1.)*.25;

  col=mix(col, vec3(.95,.98,1.), clamp(s.b,0.,1.)*uFoamVis);
  col=mix(col, col*vec3(.9,.98,1.06), .3*uE);
  o=vec4(col,1.);
}`;

function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
function mkProg(fs){ const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(pr,0,'p'); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  const U={}; const n=gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const nm=gl.getActiveUniform(pr,i).name.replace('[0]',''); U[nm]=gl.getUniformLocation(pr,nm); }
  return {pr,U}; }
const sim=mkProg(SIM), ren=mkProg(RENDER);

gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

function texParams(){ for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,v); }
function mkTarget(w,h){
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex); texParams();
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {tex,fb};
}
const vidTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,vidTex); texParams();
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([20,40,55,255]));

let W=0,H=0,DPR=1,simW=0,simH=0,A=null,B=null;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=Math.floor(innerWidth*DPR); H=Math.floor(innerHeight*DPR);
  glc.width=hud.width=W; glc.height=hud.height=H;
  simW=innerWidth<700?260:420; simH=Math.max(64,Math.round(simW*H/W));
  for(const t of [A,B]) if(t){ gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
  A=mkTarget(simW,simH); B=mkTarget(simW,simH);
}
addEventListener('resize',resize); resize();
function clearWater(){ for(const t of [A,B]){ gl.bindFramebuffer(gl.FRAMEBUFFER,t.fb); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); } gl.bindFramebuffer(gl.FRAMEBUFFER,null); }

/* ================= Filtro One Euro ================= */
class OneEuro{
  constructor(minCut=1.6,beta=3,dCut=1){ Object.assign(this,{minCut,beta,dCut}); this.x=null; this.dx=0; this.t=0; }
  a(c,dt){ const r=2*Math.PI*c*dt; return r/(r+1); }
  f(x,t){ if(this.x===null){ this.x=x; this.t=t; return x; }
    const dt=Math.max(1e-3,(t-this.t)/1000); this.t=t;
    this.dx+=this.a(this.dCut,dt)*((x-this.x)/dt-this.dx);
    this.x+=this.a(this.minCut+this.beta*Math.abs(this.dx),dt)*(x-this.x); return this.x; }
}

/* ================= Yemas de los dedos ================= */
const TIPS=[8];   // solo la yema del índice
const fingers=new Map();   // id -> {x,y,px,py,sp,fx,fy,t,plop,fresh}
function touch(id,rx,ry,now){
  const asp=W/H; let f=fingers.get(id);
  if(!f){
    f={fx:new OneEuro(),fy:new OneEuro(),sp:0,plop:true,fresh:true,t:now};
    f.x=f.px=f.fx.f(rx,now); f.y=f.py=f.fy.f(ry,now); fingers.set(id,f); return;
  }
  const x=f.fx.f(rx,now), y=f.fy.f(ry,now);
  const dt=Math.max(.008,(now-f.t)/1000);
  const speed=Math.hypot((x-f.x)*asp,y-f.y)/dt;       // pantallas por segundo
  f.sp=f.sp*.45+speed*.55; f.x=x; f.y=y; f.t=now; f.fresh=true;
}
function lift(id){ fingers.delete(id); }

/* ================= Cámara + MediaPipe ================= */
const video=document.getElementById('cam');
let hasVid=false, landmarker=null, lastVT=-1, S=[1,1], showDots=true;
function coverScale(){ if(!hasVid||!video.videoWidth) return [1,1];
  const va=video.videoWidth/video.videoHeight, ca=W/H; return ca>va?[1,va/ca]:[ca/va,1]; }
const toDisplay=lm=>({x:.5+((1-lm.x)-.5)/S[0], y:.5+(lm.y-.5)/S[1]});

async function startCamera(){
  setStatus('Pidiendo permiso de cámara…');
  try{ const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=st; await video.play(); hasVid=true;
  }catch{ setStatus('No se pudo abrir la cámara. Revisa el permiso del navegador; mientras, usa el mouse.'); return; }
  setStatus('Cargando el detector de manos…');
  try{
    const { FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},
      runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
    try{ landmarker=await HandLandmarker.createFromOptions(files,opts('GPU')); }
    catch{ landmarker=await HandLandmarker.createFromOptions(files,opts('CPU')); }
    setStatus('Listo: muestra tu dedo índice y muévelo'); setTimeout(()=>setStatus(''),4000);
  }catch(e){ console.error(e); setStatus('No cargó el detector de manos (se necesita internet). El mouse sigue funcionando.'); }
}

function detect(now){
  if(!landmarker||video.readyState<2||video.currentTime===lastVT) return;
  lastVT=video.currentTime;
  const res=landmarker.detectForVideo(video,now), seen=new Set();
  (res.landmarks||[]).forEach((lm,i)=>{
    const side=res.handednesses?.[i]?.[0]?.categoryName||('h'+i);
    for(const t of TIPS){ const id=side+'-'+t, p=toDisplay(lm[t]); touch(id,p.x,p.y,now); seen.add(id); }
  });
  for(const id of [...fingers.keys()]) if(!id.startsWith('ptr') && !seen.has(id)) lift(id);
}

/* ================= Mouse / touch ================= */
const evUV=e=>({x:e.clientX/innerWidth,y:e.clientY/innerHeight});
glc.addEventListener('pointerdown',e=>{ glc.setPointerCapture(e.pointerId); const p=evUV(e); touch('ptr'+e.pointerId,p.x,p.y,performance.now()); });
glc.addEventListener('pointermove',e=>{ if(!fingers.has('ptr'+e.pointerId)) return; const p=evUV(e); touch('ptr'+e.pointerId,p.x,p.y,performance.now()); });
const up=e=>lift('ptr'+e.pointerId);
glc.addEventListener('pointerup',up); glc.addEventListener('pointercancel',up);

/* ================= Energía del agua ================= */
let E=0;
const meterFill=document.getElementById('meterFill'), meterLabel=document.getElementById('meterLabel');
const uA=new Float32Array(48), uB=new Float32Array(48);

function buildImpulses(){
  let n=0, maxSp=0;
  for(const f of fingers.values()){
    if(!f.fresh) f.sp*=.88;          // entre cuadros de cámara la velocidad se desvanece
    maxSp=Math.max(maxSp,f.sp);
    if(n<12){
      const sp=Math.min(f.sp,3.5)*P.sens;
      let str=.02+sp*.09, rad=.009+.016*Math.min(sp/2.5,1);
      if(f.plop){ str+=.45; rad=Math.max(rad,.018); f.plop=false; }   // la yema entra al agua
      uA.set([f.px,f.py,f.x,f.y],n*4); uB.set([str,rad,0,0],n*4); n++;
    }
    f.px=f.x; f.py=f.y; f.fresh=false;
  }
  const target=Math.min(1,maxSp*P.sens/2.2);
  E+= (target-E)*(target>E?.25:.018);   // sube rápido, se calma lento
  return n;
}

function updateMeter(){
  meterFill.style.width=(E*100).toFixed(0)+'%';
  const lbl=E<.18?'Calma':E<.55?'Agua movida':'Oleaje';
  if(meterLabel.textContent!==lbl) meterLabel.textContent=lbl;
}

/* ================= HUD ================= */
function drawHud(){
  hctx.clearRect(0,0,W,H); if(!showDots) return;
  for(const [id,f] of fingers){
    if(id.startsWith('ptr')) continue;
    const r=(4+Math.min(f.sp,3)*4)*DPR;
    hctx.strokeStyle='rgba(230,245,255,.7)'; hctx.lineWidth=1.5*DPR;
    hctx.beginPath(); hctx.arc(f.x*W,f.y*H,r,0,7); hctx.stroke();
  }
}

/* ================= Loop ================= */
function frame(t){
  S=coverScale(); detect(t);
  const count=buildImpulses(); updateMeter();
  const baseDamp=.994-.022*P.visc;
  const damp=Math.min(.9985, baseDamp+.006*E);   // agua agitada: las ondas duran más

  gl.useProgram(sim.pr); gl.viewport(0,0,simW,simH);
  gl.uniform2f(sim.U.uPx,1/simW,1/simH); gl.uniform1f(sim.U.uDamp,damp); gl.uniform1f(sim.U.uAspect,W/H);
  gl.uniform1f(sim.U.uChop,E*E); gl.uniform1f(sim.U.uFoamGain,.09*E*P.foam); gl.uniform1i(sim.U.uState,0);
  gl.uniform4fv(sim.U.uA,uA); gl.uniform4fv(sim.U.uB,uB);
  for(let s=0;s<2;s++){
    gl.uniform1i(sim.U.uCount,s===0?count:0); gl.uniform1f(sim.U.uTime,(t*.001+s*.37)%100);
    gl.bindFramebuffer(gl.FRAMEBUFFER,B.fb);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,A.tex);
    gl.drawArrays(gl.TRIANGLES,0,3);
    [A,B]=[B,A];
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.useProgram(ren.pr);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,A.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,vidTex);
  if(hasVid&&video.readyState>=2) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  gl.uniform1i(ren.U.uState,0); gl.uniform1i(ren.U.uVid,1);
  gl.uniform2f(ren.U.uPx,1/simW,1/simH); gl.uniform2f(ren.U.uS,S[0],S[1]);
  gl.uniform1f(ren.U.uAspect,W/H); gl.uniform1f(ren.U.uHasVid,hasVid?1:0);
  gl.uniform1f(ren.U.uRefr,P.refr); gl.uniform1f(ren.U.uChroma,P.chroma); gl.uniform1f(ren.U.uE,E); gl.uniform1f(ren.U.uFoamVis,P.foam);
  gl.drawArrays(gl.TRIANGLES,0,3);
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
